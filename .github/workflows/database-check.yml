name: Check Supabase connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: paper
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Read-only database and verified TLS check
        env:
          PAPER_DATABASE_URL: ${{ secrets.PAPER_DATABASE_URL }}
          SUPABASE_EXPECTED_HOST: aws-0-ap-south-1.pooler.supabase.com
        run: uv run --no-dev python scripts/check_supabase.py
