name: Initialize Supabase paper database
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-paper-database-migrations
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    environment: paper
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Apply application migrations and reconcile opening paper account
        env:
          PAPER_DATABASE_URL: ${{ secrets.PAPER_DATABASE_URL }}
          INVEST_EMERGENCY_STOP: 'true'
        run: uv run --no-dev python scripts/initialize_supabase.py
