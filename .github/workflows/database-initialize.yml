name: Initialize Supabase paper database
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-paper-database-migrations
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    environment: paper
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Apply application migrations and reconcile opening paper account
        env:
          PAPER_DATABASE_URL: ${{ secrets.PAPER_DATABASE_URL }}
          INVEST_EMERGENCY_STOP: 'true'
        run: uv run --no-dev python scripts/initialize_supabase.py
