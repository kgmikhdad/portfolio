[project]
name = "adaptive-investment-engine"
version = "0.1.0"
description = "Point-in-time Indian equity research and risk-constrained paper accounting"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "numpy>=2.2,<3",
  "pyarrow>=19,<24",
  "scikit-learn>=1.6,<2",
  "gymnasium>=1.0,<2",
  "cryptography>=50,<51",
  "yfinance>=0.2.66,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "pip-audit>=2.7,<3"]

[project.scripts]
invest = "investment_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
